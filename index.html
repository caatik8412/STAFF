<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{height:100%}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
     background:#0f172a;color:#e2e8f0}
header{background:#1F3864;color:#fff;padding:14px 18px;display:flex;align-items:baseline;
       justify-content:space-between;gap:12px;padding-top:calc(14px + env(safe-area-inset-top))}
header b{font-size:19px}
header .d{font-size:13px;opacity:.85;white-space:nowrap}
.wrap{padding:16px}

/* Three across, two rows of three for six people - the whole shop on one
   screen with nothing to scroll for. Two across on a narrow phone, where
   three would be too thin to hit without looking. */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
@media (max-width:620px){ .grid{grid-template-columns:repeat(2,1fr);gap:12px} }
.person{border:0;border-radius:18px;padding:30px 12px;background:#1e40af;color:#fff;
        font-size:clamp(20px,3.2vw,30px);font-weight:800;letter-spacing:.2px;
        min-height:clamp(130px,22vh,190px);width:100%;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.person small{font-size:13px;font-weight:600;opacity:.85}
/* green while they are in, so a glance at the wall says who is on the floor */
.person.here{background:#15803d}
.person.done{background:#1e293b;color:#64748b}
.person:active{transform:scale(.98)}

.msg{position:fixed;left:0;right:0;bottom:0;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom));
     font-size:20px;font-weight:700;text-align:center;transform:translateY(110%);transition:transform .18s}
.msg.show{transform:translateY(0)}
.msg.ok{background:#047857;color:#fff}
.msg.no{background:#b91c1c;color:#fff}
.msg.wait{background:#1e3a5f;color:#fff}

.card{background:#1e293b;border:1px solid #334155;border-radius:12px;padding:14px;margin-bottom:14px}
label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:#94a3b8;margin-bottom:5px}
input,textarea{width:100%;padding:13px;font-size:16px;border:1px solid #475569;border-radius:10px;
      background:#0f172a;color:#e2e8f0;user-select:text;font-family:inherit}
textarea{min-height:150px;line-height:1.7}
.setbtn{margin-top:10px;padding:14px;width:100%;border:0;border-radius:10px;background:#2563eb;
        color:#fff;font-weight:700;font-size:16px}
.setbtn.g{background:#334155}
.muted{color:#94a3b8;font-size:13px}
.bar{display:flex;align-items:center;gap:10px;padding:0 18px 16px;
     padding-bottom:calc(16px + env(safe-area-inset-bottom));color:#475569;font-size:12px}
.bar .grow{flex:1}
.bar button{background:transparent;border:0;color:#475569;font-size:12px;padding:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#16a34a;display:inline-block}
.dot.off{background:#b45309}
.pend{color:#b45309;font-weight:700}
</style>
</head>
<body>

<header>
  <div><b id="shop">Attendance</b></div>
  <span class="d" id="dateLine"></span>
</header>

<div class="wrap">
  <div class="card" id="setupCard" style="display:none">
    <label>Names, one to a line</label>
    <textarea id="names" spellcheck="false" autocapitalize="words"></textarea>
    <button class="setbtn" id="save">Save</button>
    <button class="setbtn g" id="cancel">Cancel</button>
    <p class="muted" style="margin:12px 0 0">The names are kept on this phone. Everything else is already
      set &mdash; there is nothing to paste in.</p>
  </div>
  <div class="grid" id="people"></div>
</div>

<div class="bar">
  <span class="dot" id="dot"></span>
  <span id="state">&nbsp;</span>
  <span class="grow"></span>
  <button id="setup">settings</button>
</div>

<div id="msg" class="msg"></div>

<script>
/* -------------------------------------------------------------------------
   The attendance app

   It hangs on a wall or sits in a pocket and it does one thing. Names, nothing
   else. Tap your own and the time is written down. The first tap of the day is
   coming in, the next is going out, and so it goes - lunch, a run to the
   godown, home - so nobody has to choose which button this one is. At midnight
   the day starts empty again.

   It is one file, so there is one thing to put on the site and nothing beside
   it to keep in step. It can be added to a phone's home screen and it opens
   full screen like an app.

   A mark is written on the phone the instant it is tapped and shown as marked;
   it goes up to the sheet when there is internet, on its own. A wifi that
   drops in the middle of the morning therefore costs nothing. What it cannot
   do, being one file, is open from cold with no signal at all - that needs a
   second file beside it, and the shop decided two files was the point.

   The clock is the phone's, corrected against the sheet whenever they speak,
   so a phone whose time has drifted still writes down the right minute.

   It keeps to itself: it talks only to the sheet, and nothing in the shop
   program reaches into it.
------------------------------------------------------------------------- */
var $ = function (i) { return document.getElementById(i); };
/* The shop's own sheet, built in, so nobody is ever asked to paste a link and
   no phone can be pointed at the wrong one. */
var EXEC = "https://script.google.com/macros/s/AKfycbwEt_03-oIDaeWRVgSd7UVfsBlF83N3yNm2H0FH_SEUSyZe6sPmq2bYwnOlgQRlZEBo/exec";

var K_NAMES = "pf_punch_names", K_Q = "pf_punch_queue",
    K_SEEN = "pf_punch_seen", K_SKEW = "pf_punch_skew",
    K_MINE = "pf_punch_mine";

var DEFAULT_NAMES = ["Sikandar","Samir","Sahil","Nilesh","Abbas","Sachin"];
/* Odd taps are coming in, even ones going out. Two words, and that is the
   whole of it. */
var MARKS = [["in","came in"],["out","went out"]];

/* SEEN is what the sheet says; MINE is what was tapped on this phone today.
   A tap leaves the queue the moment it is safely up, so without MINE it would
   disappear off the screen until the sheet got round to echoing it back. */
var NAMES = [], QUEUE = [], SEEN = { date:"", marks:[] }, MINE = { date:"", marks:[] },
    SKEW = 0, BUSY = false;

function get(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
function put(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

NAMES = get(K_NAMES, DEFAULT_NAMES);
QUEUE = get(K_Q, []);
SEEN  = get(K_SEEN, { date:"", marks:[] });
MINE  = get(K_MINE, { date:"", marks:[] });
SKEW  = get(K_SKEW, 0);

/* ---------- the clock ---------- */
function nowDate(){ return new Date(Date.now() + SKEW); }
function today(){
  var d = nowDate();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function hhmm(){
  var d = nowDate();
  return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
/* Kept as 09:31 so it sorts and compares; shown as 9:31 am, because that is
   how a shop says it. Nobody reads 18:05 off a wall. */
function ampm(t){
  var m = /^(\d{1,2}):(\d{2})$/.exec(String(t||""));
  if (!m) return t || "";
  var h = Number(m[1]), s = h < 12 ? "am" : "pm";
  h = h % 12; if (!h) h = 12;
  return h + ":" + m[2] + " " + s;
}
/* The sheet tells us its time whenever it answers; the difference is kept so
   the marks made with no signal are still stamped to the right minute. */
function learnClock(serverHHMM, serverDate){
  if (!serverHHMM || !serverDate) return;
  var p = serverHHMM.split(":");
  var s = new Date(serverDate + "T00:00:00");
  s.setHours(Number(p[0]), Number(p[1]), 0, 0);
  var diff = s.getTime() - Date.now();
  /* a minute either way is the rounding, not a drift worth carrying */
  if (Math.abs(diff) > 90000) { SKEW = diff; put(K_SKEW, SKEW); }
}

/* ---------- what is known about today ---------- */
function marksToday(){
  var d = today();
  if (SEEN.date !== d) SEEN = { date:d, marks:[] };
  if (MINE.date !== d) { MINE = { date:d, marks:[] }; put(K_MINE, MINE); }
  var all = SEEN.marks.slice();
  MINE.marks.forEach(function(m){ all.push(m); });
  QUEUE.forEach(function(q){ if (q.date === d) all.push({ name:q.name, mark:q.mark, time:q.time }); });
  /* the same minute from two places is one tap */
  var seen = {};
  return all.filter(function(m){
    var k = m.name + "|" + m.time;
    if (seen[k]) return false;
    seen[k] = 1; return true;
  });
}
/* Everything this person has tapped today, earliest first. */
function forPerson(name){
  return marksToday().filter(function(m){ return m.name === name; })
    .map(function(m){ return m.time; })
    .filter(function(t,i,a){ return a.indexOf(t) === i; })
    .sort();
}
function isIn(name){ return forPerson(name).length % 2 === 1; }
/* There is always a next tap - somebody can always step out and come back. */
function nextFor(name){ return isIn(name) ? MARKS[1] : MARKS[0]; }

/* ---------- the screen ---------- */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c];
  });
}
function say(html, kind){
  var m = $("msg");
  m.className = "msg show " + (kind || "ok");
  m.innerHTML = html;
  clearTimeout(say._t);
  say._t = setTimeout(function(){ m.className = "msg " + (kind || "ok"); }, 2600);
}
function niceDate(){
  var d = nowDate();
  var mo = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return d.getDate() + " " + mo[d.getMonth()];
}
function draw(){
  $("dateLine").textContent = niceDate();
  $("people").innerHTML = NAMES.map(function(name){
    var mine = forPerson(name), inNow = mine.length % 2 === 1;
    var last = mine.length ? ampm(mine[mine.length-1]) : "";
    return '<button class="person' + (inNow ? " here" : "") + '"'
      + ' onclick="mark(' + esc(JSON.stringify(name)) + ')">'
      + esc(name)
      + '<small>' + (mine.length
          ? (inNow ? "in since " + last : "out at " + last)
          : "tap to mark in") + '</small>'
      + '</button>';
  }).join("")
  || '<div class="card muted">No names yet. Open <b>settings</b> below and type them, one to a line.</div>';
  var pend = QUEUE.length;
  $("dot").className = "dot" + (navigator.onLine ? "" : " off");
  $("state").innerHTML = navigator.onLine
    ? (pend ? '<span class="pend">' + pend + ' waiting to go up</span>' : "saved")
    : (pend ? '<span class="pend">no internet — ' + pend + ' held on this phone</span>'
            : "no internet — marks will be held here");
}

/* ---------- marking ---------- */
function mark(name){
  var nx = nextFor(name);
  var t = hhmm();
  /* two taps in the same minute are the same tap - a double press, a handover */
  if (forPerson(name).indexOf(t) >= 0) { say(esc(name) + " \u2014 already marked at " + ampm(t), "ok"); return; }
  var rec = { id: String(Date.now()) + Math.random().toString(36).slice(2,7),
              date: today(), name: name, mark: nx[0], time: t };
  /* Written on the phone first, and shown as marked at once. Whether the
     internet is there decides when it goes up, not whether it counted. */
  QUEUE.push(rec); put(K_Q, QUEUE);
  if (MINE.date !== rec.date) MINE = { date:rec.date, marks:[] };
  MINE.marks.push({ name:rec.name, mark:rec.mark, time:rec.time });
  put(K_MINE, MINE);
  draw();
  say(esc(name) + " — " + nx[1] + " at " + ampm(rec.time), "ok");
  if (navigator.vibrate) navigator.vibrate(45);
  flush();
}

/* ---------- the sheet ---------- */
function ask(body){
  return fetch(EXEC, { method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body: JSON.stringify(body) }).then(function(r){ return r.json(); });
}
function flush(){
  if (BUSY || !QUEUE.length || !navigator.onLine) return;
  BUSY = true;
  var batch = QUEUE.slice(0, 20);
  ask({ attend:"push", names:NAMES, marks:batch }).then(function(r){
    BUSY = false;
    if (!r || !r.ok) return;
    var done = {};
    (r.saved || batch.map(function(b){ return b.id; })).forEach(function(id){ done[id] = 1; });
    QUEUE = QUEUE.filter(function(q){ return !done[q.id]; });
    put(K_Q, QUEUE);
    if (r.list) take(r.list);
    draw();
    if (QUEUE.length) flush();
  }).catch(function(){ BUSY = false; });
}
function take(d){
  if (!d || !d.ok) return;
  learnClock(d.now, d.date);
  if (d.shop) $("shop").textContent = d.shop;
  SEEN = { date: d.date, marks: [] };
  (d.staff || []).forEach(function(p){
    var t = p.times;
    /* the sheet sends the times in order; an older sheet still sends the four
       named marks, which alternate the same way, so both read back */
    if (!t) { t = []; ["in","lo","li","out"].forEach(function(k){
      if (p.marks && p.marks[k]) t.push(p.marks[k]); }); }
    t.forEach(function(time, i){
      SEEN.marks.push({ name:p.name, mark:(i%2?"out":"in"), time:time });
    });
  });
  put(K_SEEN, SEEN);
}
function load(){
  if (!navigator.onLine) { draw(); return; }
  ask({ attend:"list", names:NAMES }).then(function(d){
    take(d); draw(); flush();
  }).catch(function(){ draw(); });
}

/* ---------- settings ---------- */
function openSetup(){
  $("names").value = NAMES.join("\n");
  $("setupCard").style.display = "";
  $("people").style.display = "none";
}
function closeSetup(){
  $("setupCard").style.display = "none";
  $("people").style.display = "";
}
$("setup").onclick = openSetup;
$("cancel").onclick = closeSetup;
$("save").onclick = function(){
  NAMES = $("names").value.split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
  put(K_NAMES, NAMES);
  closeSetup(); draw(); load();
  say("Saved", "ok");
};

/* ---------- keeping up ---------- */
window.addEventListener("online",  function(){ draw(); load(); });
window.addEventListener("offline", draw);
setInterval(function(){ if (SEEN.date && SEEN.date !== today()) { SEEN = { date:today(), marks:[] }; draw(); } flush(); }, 60000);
setInterval(function(){ if (!document.hidden) load(); }, 300000);
document.addEventListener("visibilitychange", function(){ if (!document.hidden) load(); });

draw();
load();
</script>
</body>
